name: ASP.NET MVC Build

on:
  push:
    branches: [ master, portfolio-hardening ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore CSMMYM.sln

      - name: Build solution
        run: msbuild CSMMYM.sln /m /p:Configuration=Release /p:Platform="Any CPU" /p:RestorePackages=false
